# 软件功能测试系统 — 配置样例
# 复制为 config.yaml 后按需修改；也可用环境变量 QTS_API_KEY / OPENAI_API_KEY

server:
  host: "127.0.0.1"
  port: 8787

# AI 能力配置（默认多模态；密钥请用环境变量，不要提交到仓库）
ai:
  provider: "openai"              # openai | anthropic | custom
  base_url: ""                    # 例如你的兼容网关地址，留空则用 provider 默认
  api_key: ""                     # 留空；或 export QTS_API_KEY=...
  model: ""                       # 文本模型名
  vision_model: ""                # 多模态/视觉模型名
  temperature: 0.3
  max_tokens: 8000
  timeout: 120

discovery:
  max_pages: 30
  max_depth: 3
  timeout: 15
  same_origin_only: true
  respect_robots: false
  allow_methods: ["GET", "HEAD", "OPTIONS"]
  deny_path_keywords:
    - "delete"
    - "remove"
    - "create"
    - "update"
    - "edit"
    - "upload"
  include_api_hints:
    - "/api/"
    - "/query"
    - "/list"
    - "/search"
    - "/detail"

test_policy:
  scope: "query_only"
  forbid_mutations: true
  language: "zh-CN"
  max_cases_per_point: 8
  include_negative: true
  include_auth_cases: true
